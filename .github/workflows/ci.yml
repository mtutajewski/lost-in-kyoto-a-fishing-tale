name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build and test
        run: python run.py check

      - name: Upload bundled game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lost-in-kyoto
          path: dist/lost-in-kyoto.html

  notify-site:
    # After a green build on main, ask the site repo to redeploy the game.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger marcintutajewski.com deploy
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/mtutajewski/marcintutajewski.com/dispatches \
            -f event_type=lost-in-kyoto-updated \
            -F "client_payload[sha]=${{ github.sha }}"
